# Publish to PyPI via OIDC Trusted Publisher
#
# One-time setup on PyPI (no token needed afterwards):
#   1. Go to https://pypi.org/manage/project/video-url-analyzer-mcp/settings/publishing/
#   2. Add a "Trusted Publisher":
#        - Publisher: GitHub
#        - Owner: u2n4
#        - Repository: video-url-analyzer-mcp
#        - Workflow filename: publish.yml
#        - Environment name: pypi
#   3. In this repo: Settings -> Environments -> New environment "pypi".
#
# Then to release: bump version, push a tag matching v*.*.* (e.g. `git tag v1.5.4
# && git push origin v1.5.4`). This workflow builds and publishes automatically
# via short-lived OIDC credentials -- no stored token anywhere.
#
# Gate: the publish job needs the test job. The test job checks out the exact
# commit the tag points to and runs the same ruff, pyright and pytest steps as
# CI. If any of them fails, nothing is built or published.
#

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Type check with pyright
        run: uv run pyright src/

      - name: Run tests
        run: uv run pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # REQUIRED for OIDC Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Publish (OIDC)
        run: uv publish
